<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>RitmoForceCurve</title>

<style>
  /* --- Copied tab styling from example_workout.html --- */
  #fc-tabset {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 1rem;
  }
  .fc-title {
    text-align: center;
    font-size: 2.0rem;
    font-weight: 700;
    margin-top: 0.5rem;
    margin-bottom: 1.0rem;
  }
  .fc-tab-buttons {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .fc-tab-button {
    padding: 0.4rem 0.8rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .fc-tab-button.active {
    background: #e0e0e0;
    border-color: #888;
    font-weight: 600;
  }
  .fc-tab-content {
    display: none;
  }
  .fc-tab-content.active {
    display: block;
  }

  .fc-iframe-wrapper {
    width: 100%;
    height: 85vh;
    border: 1px solid #ddd;
    box-sizing: border-box;
  }
  .fc-iframe-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* --- Help videos --- */
  .fc-help-note {
    font-size: 0.95rem;
    color: #555;
    margin-bottom: 1rem;
    font-style: italic;
  }

  .fc-video-list {
    list-style: none;
    padding-left: 0;
    max-width: 900px;
  }

  .fc-video-item {
    margin-bottom: 1.25rem;
  }

  .fc-video-link {
    font-size: 1.15rem;
    font-weight: 600;
    color: #0066cc;
    text-decoration: none;
  }

  .fc-video-link:hover {
    text-decoration: underline;
  }

  .fc-video-desc {
    font-size: 0.95rem;
    color: #444;
    margin-top: 0.25rem;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var buttons = document.querySelectorAll('.fc-tab-button');
    var contents = document.querySelectorAll('.fc-tab-content');

    function activateTab(targetId) {
      contents.forEach(function(div) {
        div.classList.toggle('active', div.id === targetId);
      });
    }

    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var target = this.getAttribute('data-target');
        activateTab(target);
        buttons.forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
    });

    // Activate first tab on load
    if (buttons.length > 0) {
      buttons[0].click();
    }
  });
</script>

</head>
<body>

<div id="fc-tabset">
  <div class="fc-title">RitmoForceCurve</div>

  <div class="fc-tab-buttons">
    <button class="fc-tab-button" data-target="tab-welcome">Welcome</button>
    <button class="fc-tab-button" data-target="tab-instructions">Oar Kit Instructions</button>
    <button class="fc-tab-button" data-target="tab-workout">Workout Auto Process Example</button>
    <button class="fc-tab-button" data-target="tab-help-videos">Help Videos</button>
  </div>

  <!-- Instructions Tab -->
  <div id="tab-welcome" class="fc-tab-content">
    <div class="fc-iframe-wrapper">
      <iframe src="welcome.html"></iframe>
    </div>
  </div>

  <!-- Instructions Tab -->
  <div id="tab-instructions" class="fc-tab-content">
    <div class="fc-iframe-wrapper">
      <iframe src="instructions.html"></iframe>
    </div>
  </div>

  <!-- Workout Example Tab -->
  <div id="tab-workout" class="fc-tab-content">
    <div class="fc-iframe-wrapper">
      <iframe src="example_workout.html"></iframe>
    </div>
  </div>

  <!-- Help Videos Tab -->
  <div id="tab-help-videos" class="fc-tab-content">

    <div class="fc-help-note">
      Help videos open in a new browser tab.
    </div>

    <ul class="fc-video-list">

      <li class="fc-video-item">
        <a
          class="fc-video-link"
          href="https://drive.google.com/file/d/1fXylc4PhQFsWK-nGhTQurHxmAgeXAoW5/view"
          target="_blank"
          rel="noopener noreferrer">
          How to mount sensors on the oar
        </a>
        <div class="fc-video-desc">
          Step-by-step overview of mounting the sensors and connecting them for use on the water.
        </div>
      </li>

    </ul>

  </div>

</div>

</body>
</html>
