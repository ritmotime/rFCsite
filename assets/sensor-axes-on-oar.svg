<text x="496" y="191" class="t y">+Y</text><text x="887" y="191" class="t y">+Y</text><text x="415" y="298" class="t x">+X</text><text x="808" y="298" class="t x">+X</text>
<path d="M276 265L371 209" class="leader"/><text x="38" y="284" class="s">Both sensor buttons face blade (−Y).</text>
<path d="M566 278A90 90 0 0 1 552 179" class="axis" stroke="#8bcfff" marker-end="url(#z)"/><text x="575" y="302" class="t z">RZ</text><text x="489" y="333" class="s">Drive / bend rotation in this plane</text>
