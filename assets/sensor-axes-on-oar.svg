<path d="M41 199L182 193H214V215H182L41 209Z" fill="#84bfc0" stroke="#c7edf0" stroke-width="2"/>
<rect x="907" y="188" width="62" height="32" rx="10" fill="#b6c9d4"/>
<rect x="633" y="177" width="25" height="54" rx="4" fill="#8c9b4a" stroke="#d8e591" stroke-width="2"/>
<use href="#mount" transform="translate(398 204)"/><use href="#mount" transform="translate(790 204)"/>
<text x="40" y="133" class="t">Blade</text><text x="40" y="158" class="s">Square: seen edge-on</text><path d="M121 165V193" class="leader"/>
<text x="902" y="151" class="t">Handle</text><path d="M938 160V188" class="leader"/>
<text x="281" y="117" class="t">Outboard sensor</text><path d="M393 124V139" class="leader"/>
<text x="729" y="117" class="t">Inboard sensor</text><path d="M790 124V139" class="leader"/>
