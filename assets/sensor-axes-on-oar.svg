<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Mount both sensors so RZ measures drive and bend rotation</title><desc id="desc">Top view: blade at left, handle at right, one sensor each side of the oar collar, attached with hook-and-loop straps. Both offset buttons and hidden USB-C ends face the blade; positive Y faces the handle. With the blade square, both sticker faces point upward, parallel to the horizontal drive plane; positive Z is upward, perpendicular to that plane. RZ is rotation about Z. An end view shows a vertical squared blade and a face-up mount above the shaft; the curved saddle contacts the shaft and its snap lips engage the housing above.</desc>
<defs><marker id="x" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ffb390"/></marker><marker id="y" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8ce0bf"/></marker><marker id="z" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8bcfff"/></marker><pattern id="strap" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#192631"/><path d="M0 6L6 0" stroke="#8c9fac"/></pattern><style>text{font-family:Arial,sans-serif;fill:#f0f5f8}.h{font-size:24px;font-weight:700}.t{font-size:20px}.s{font-size:18px;fill:#c2d2dc}.leader{fill:none;stroke:#bdcdd5;stroke-width:1.5}.axis{fill:none;stroke-width:3}.x{fill:#ffb390}.y{fill:#8ce0bf}.z{fill:#8bcfff}</style>
<g id="mount"><rect x="-45" y="-65" width="90" height="130" rx="8" fill="url(#strap)" stroke="#a9becb"/><rect x="-50" y="-44" width="100" height="88" rx="8" fill="#e8d54d" stroke="#fff0a3"/><rect x="-57" y="-34" width="114" height="68" rx="12" fill="#15242e" stroke="#a9becb" stroke-width="2"/><rect x="-48" y="-26" width="96" height="52" rx="9" fill="#34424c"/><path d="M3-20Q69 0 3 20" fill="none" stroke="#efd34b" stroke-width="2"/><circle cx="-25" cy="0" r="8" fill="#eabf21" stroke="#fff4c0"/><path d="M5 0H99" class="axis" stroke="#8ce0bf" marker-end="url(#y)"/><path d="M5 0V94" class="axis" stroke="#ffb390" marker-end="url(#x)"/><circle cx="5" cy="0" r="8" fill="#283540" stroke="#8bcfff" stroke-width="2"/><circle cx="5" cy="0" r="2.5" fill="#8bcfff"/></g></defs>
<rect width="1000" height="760" rx="16" fill="#283540"/>
<text x="30" y="43" class="h">On the oar · square the blade before checking orientation</text>
<text x="30" y="74" class="s">TOP VIEW · sensors enlarged for clarity; spacing is schematic</text>
