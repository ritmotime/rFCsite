<path d="M218 488H157V464" class="leader"/><text x="38" y="438" class="t">Sticker face up</text><text x="38" y="463" class="s">Both mounts</text>
<text x="38" y="584" class="t">Square blade</text><text x="38" y="609" class="s">Vertical blade face</text><path d="M177 613L257 662" class="leader"/>
<path d="M318 535H385" class="leader"/><text x="398" y="541" class="t">Saddle against shaft</text><text x="398" y="568" class="s">Snap lips face housing, away from shaft.</text>
<text x="551" y="434" class="t z">Z is perpendicular to the drive plane.</text><text x="551" y="464" class="s">RZ is rotation ABOUT Z.</text><text x="551" y="491" class="s">It is not a force arrow pointing along Z.</text>
<text x="398" y="625" class="s">Feather / square rotation is about shaft axis Y.</text><text x="398" y="653" class="s">The mount turns with the oar during feathering.</text>
<path d="M30 696H970" stroke="#526976"/><text x="30" y="729" class="s">Keep clear of hands and oarlock. Enter actual positions, then repeat motion alignment.</text>
