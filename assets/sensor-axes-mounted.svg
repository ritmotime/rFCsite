<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">The same sensor axes in the assembled mount</title><desc id="desc">Front view of the sensor in its black cage with a flexible ring, yellow side clips and hook-and-loop strap. Positive Y is toward the handle, positive X right and positive Z out of the visible sticker face. The USB-C port is hidden at the negative Y button end. The curved saddle is behind the housing, toward the oar, with its snap lips facing the housing.</desc>
<defs><marker id="x" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ffb390"/></marker><marker id="y" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8ce0bf"/></marker><pattern id="strap" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#15212b"/><path d="M0 0L8 8M-4 4L4 12M4-4L12 4" stroke="#4a606e"/></pattern><style>text{font-family:Arial,sans-serif;fill:#f0f5f8}.h{font-size:24px;font-weight:700}.t{font-size:20px}.s{font-size:18px;fill:#c2d2dc}.leader{fill:none;stroke:#bdcdd5;stroke-width:1.5}.axis{fill:none;stroke-width:3.5}.x{fill:#ffb390}.y{fill:#8ce0bf}.z{fill:#8bcfff}</style></defs>
<rect width="900" height="650" rx="16" fill="#283540"/>
<text x="30" y="43" class="h">Assembled mount · same axes, same button end</text><text x="30" y="72" class="s">Front view. The saddle and oar sit behind the housing.</text>
