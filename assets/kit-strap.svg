<path d="M54 223V204" class="arrow"/><path d="M342 223V204" class="arrow"/>
<text x="198" y="197" class="label" text-anchor="middle">Oar shaft</text><text x="198" y="221" class="small" text-anchor="middle">Smooth backing inward</text>
<text x="198" y="396" class="label" text-anchor="middle">Wrap around the shaft.</text><text x="198" y="421" class="small" text-anchor="middle">Each end folds back on its own side.</text>
<text x="198" y="459" class="small" text-anchor="middle">Yellow: clip and curved saddle</text>
<!-- Enlarged slot; ribbons drawn in section with fastening face visible -->
<text x="594" y="84" class="label" text-anchor="middle">Clip slot · enlarged section</text>
<text x="474" y="155" class="small" text-anchor="middle">INSIDE</text><text x="685" y="155" class="small" text-anchor="middle">OUTSIDE</text>
<text x="474" y="178" class="small" text-anchor="middle">Oar side</text><text x="685" y="178" class="small" text-anchor="middle">Fold back here</text>
<path d="M552 198H576V266H552Z M552 294H576V367H552Z" class="yellow"/>
<!-- Smooth outer surfaces and the two rough faces meeting in overlap -->
<path d="M439 280H717Q739 280 739 261Q739 241 717 241H607" fill="none" stroke="#d2dde4" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
