<text x="451" y="345" class="small">Thread</text><text x="451" y="367" class="small">outward.</text>
<path d="M665 331V266" class="lead"/><text x="595" y="353" class="small">Press the two textured</text><text x="595" y="375" class="small">faces together.</text>
<text x="421" y="424" class="label">One fastening face; one smooth back.</text><text x="421" y="451" class="small">Hooks and loops share the same face.</text><text x="421" y="474" class="small">Fold the tail back without twisting it.</text>
<text x="28" y="520" class="sub">ENLARGED SLOT SHOWS THE STRAP SEPARATED SLIGHTLY TO REVEAL BOTH FACES</text></svg>